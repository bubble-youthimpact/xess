<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found · Xess</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* Layout: one readable column; small brand bar, the document in a white card */
:root{
  --bg:#f6f6f6; --card:#ffffff; --fg:#1b1b1b; --muted:#5f5a59; --line:#e4e1e0; --accent:#FF4136;
  --font:'Poppins','Noto Sans KR',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#121010;--card:#1d1a1a;--fg:#f2eeed;--muted:#aaa3a1;--line:#353030;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121010;--card:#1d1a1a;--fg:#f2eeed;--muted:#aaa3a1;--line:#353030;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
body{margin:0;font-family:var(--font);font-size:15.5px;line-height:1.65;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
html[lang="ko"] body{word-break:keep-all}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.bar{display:flex;justify-content:space-between;align-items:center;padding:4px 4px 6px}
.logo{font-size:26px;font-weight:800;letter-spacing:-.02em}.logo b{color:var(--accent)}
.lang{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--card);color:var(--fg);
  border-radius:999px;padding:5px 13px;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer}
.lang:hover{border-color:var(--accent)}
.lang:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
article{background:var(--card);border-radius:28px;padding:30px 26px 34px;display:flex;flex-direction:column;gap:12px}
h1{margin:0;font-size:clamp(28px,6vw,36px);font-weight:800;line-height:1.2;text-wrap:balance}
.meta{margin:0;font-size:13.5px;color:var(--muted)}
h2{margin:16px 0 0;font-size:18px;font-weight:700;line-height:1.35}
p{margin:0}
ul{margin:0;padding-left:1.25em;display:flex;flex-direction:column;gap:6px}
strong{font-weight:600}
.copy{user-select:all;font-weight:500}
footer{text-align:center;font-size:13px;color:var(--muted);padding-top:6px}
</style>
<style>
.links{list-style:none;padding:0;margin:4px 0 0;display:flex;flex-direction:column}
.links li{border-top:1px solid var(--line)}.links li:first-child{border-top:0}
.links a{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 2px;color:var(--fg);text-decoration:none;font-weight:600;font-size:17px}
.links a:hover{color:var(--accent)}
.links small{display:block;font-weight:400;color:var(--muted);font-size:13.5px}
.big{font-size:64px;font-weight:800;color:var(--accent);line-height:1;margin:0}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar"><span class="logo">Xess<b>.</b></span></div>
  <article>
    <p class="big">404</p>
    <h1>Page not found</h1>
    <p>We couldn't find that page. 요청하신 페이지를 찾을 수 없습니다.</p>
    <ul class="links">
      <li><a data-to="privacy/" href="privacy/"><span>Privacy Policy<small>개인정보처리방침</small></span><span aria-hidden="true">→</span></a></li>
      <li><a data-to="terms/" href="terms/"><span>Terms of Service<small>서비스 이용약관</small></span><span aria-hidden="true">→</span></a></li>
    </ul>
  </article>
  <footer>© 2026 Xess</footer>
</div>
<script>
(function(){var p=location.pathname.split('/').filter(Boolean);
var base=/github\.io$/.test(location.hostname)&&p.length&&!/^(privacy|terms)$/.test(p[0])&&!/\.html$/.test(p[0])?'/'+p[0]+'/':'/';
document.querySelectorAll('a[data-to]').forEach(function(a){a.href=base+a.getAttribute('data-to')});})();
</script>
</body>
</html>
