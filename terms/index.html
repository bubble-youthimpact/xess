<style>
/* Layout: one readable column; small brand bar, the document in a white card */
:root{
  --bg:#f6f6f6; --card:#ffffff; --fg:#1b1b1b; --muted:#5f5a59; --line:#e4e1e0; --accent:#FF4136;
  --font:'Poppins','Noto Sans KR',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#121010;--card:#1d1a1a;--fg:#f2eeed;--muted:#aaa3a1;--line:#353030;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121010;--card:#1d1a1a;--fg:#f2eeed;--muted:#aaa3a1;--line:#353030;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
body{margin:0;font-family:var(--font);font-size:15.5px;line-height:1.65;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
html[lang="ko"] body{word-break:keep-all}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.bar{display:flex;justify-content:space-between;align-items:center;padding:4px 4px 6px}
.logo{font-size:26px;font-weight:800;letter-spacing:-.02em}.logo b{color:var(--accent)}
.lang{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--card);color:var(--fg);
  border-radius:999px;padding:5px 13px;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer}
.lang:hover{border-color:var(--accent)}
.lang:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
article{background:var(--card);border-radius:28px;padding:30px 26px 34px;display:flex;flex-direction:column;gap:12px}
h1{margin:0;font-size:clamp(28px,6vw,36px);font-weight:800;line-height:1.2;text-wrap:balance}
.meta{margin:0;font-size:13.5px;color:var(--muted)}
h2{margin:16px 0 0;font-size:18px;font-weight:700;line-height:1.35}
p{margin:0}
ul{margin:0;padding-left:1.25em;display:flex;flex-direction:column;gap:6px}
strong{font-weight:600}
.copy{user-select:all;font-weight:500}
footer{text-align:center;font-size:13px;color:var(--muted);padding-top:6px}
</style>

</head>
<body>
<div class="wrap">

    <span class="logo">Xess<b>.</b></span>

<script type="application/json" id="d">{"en": {"title": "Terms of Service", "meta": "Effective Date: October 27, 2026", "body": "\n<p>Welcome to Xess. These terms explain the rules for using the Xess app and website. By using Xess, you agree to them. If you don't agree, please don't use Xess.<\/p>\n\n<h2>1. What Xess Is<\/h2>\n<p>Xess is a free platform that gathers information about adaptive leisure activities, local clubs, events and helpful products for people with disabilities, their families and their friends.<\/p>\n\n<h2>2. Using Xess<\/h2>\n<ul>\n<li>You can browse everything on Xess without an account.<\/li>\n<li>An account is optional. It lets you keep a profile and save favorites.<\/li>\n<li>Please give accurate information when you sign up, and keep your password private. You are responsible for activity on your account.<\/li>\n<li>If you are under 14, please ask a parent or guardian before creating an account.<\/li>\n<\/ul>\n\n<h2>3. Information Only, Not Medical Advice<\/h2>\n<p>Activity guides on Xess are general information. They are not medical, therapeutic or professional advice. Before starting a new physical activity, talk with your doctor, therapist or a qualified instructor about what is safe for you. Every activity carries some risk, so please take part at your own pace and follow the safety guidance of the program you join.<\/p>\n\n<h2>4. Other Organizations, Events and Products<\/h2>\n<ul>\n<li>Clubs, events and stores listed on Xess are run by other organizations, not by Xess.<\/li>\n<li>Dates, prices and details can change. Please check with the organizer before you go.<\/li>\n<li>Product links are suggestions, not endorsements. Any purchase is between you and the seller.<\/li>\n<\/ul>\n\n<h2>5. Acceptable Use<\/h2>\n<p>Please don't misuse Xess. For example, don't:<\/p>\n<ul>\n<li>Try to break into, overload or disrupt the service<\/li>\n<li>Pretend to be someone else or use another person's account<\/li>\n<li>Copy large parts of Xess for commercial use without permission<\/li>\n<\/ul>\n\n<h2>6. Our Content<\/h2>\n<p>The text, design and illustrations on Xess belong to Xess or the people who licensed them to us. You are welcome to use and share them for personal, non-commercial purposes.<\/p>\n\n<h2>7. Ending Your Account<\/h2>\n<p>You can delete your account at any time on the Profile page. We may suspend an account that breaks these terms.<\/p>\n\n<h2>8. No Guarantees<\/h2>\n<p>We work hard to keep information on Xess accurate and up to date, but we provide Xess “as is” and can't guarantee that everything is complete, correct or always available.<\/p>\n\n<h2>9. Limitation of Liability<\/h2>\n<p>To the extent the law allows, Xess is not responsible for losses or injuries that result from using the service, from taking part in listed activities or events, or from products bought through linked stores.<\/p>\n\n<h2>10. Changes to These Terms<\/h2>\n<p>If we change these terms, we will update the date at the top of this page. Continuing to use Xess after a change means you accept the updated terms.<\/p>\n\n<h2>11. Governing Law<\/h2>\n<p>These terms are governed by the laws of the Republic of Korea.<\/p>\n\n<h2>Contact Us<\/h2>\n<p>Questions about these terms? Reach out at:<br><strong>Email:<\/strong> <span class=\"copy\">bubble.youthimpact@gmail.com<\/span><\/p>\n"}, "ko": {"title": "서비스 이용약관", "meta": "시행일: 2026년 10월 27일", "body": "\n<p>Xess에 오신 것을 환영합니다. 이 약관은 Xess 앱과 웹사이트 이용 규칙을 설명합니다. Xess를 이용하면 이 약관에 동의하는 것으로 봅니다. 동의하지 않으신다면 Xess를 이용하지 말아 주세요.<\/p>\n\n<h2>1. Xess 소개<\/h2>\n<p>Xess는 장애인과 그 가족, 친구를 위해 어댑티브 여가 활동, 지역 클럽, 행사, 유용한 제품 정보를 모은 무료 플랫폼입니다.<\/p>\n\n<h2>2. 이용 방법<\/h2>\n<ul>\n<li>Xess의 모든 정보는 계정 없이 둘러볼 수 있습니다.<\/li>\n<li>계정은 선택 사항이며, 계정이 있으면 프로필을 만들고 즐겨찾기를 저장할 수 있습니다.<\/li>\n<li>가입 시 정확한 정보를 입력하고 비밀번호를 안전하게 지켜 주세요. 계정에서 일어나는 활동은 이용자 본인의 책임입니다.<\/li>\n<li>만 14세 미만이라면 계정을 만들기 전에 부모님이나 보호자에게 먼저 물어봐 주세요.<\/li>\n<\/ul>\n\n<h2>3. 정보 제공일 뿐, 의료 조언이 아닙니다<\/h2>\n<p>Xess의 활동 가이드는 일반적인 정보이며 의료, 치료 또는 전문적인 조언이 아닙니다. 새로운 신체 활동을 시작하기 전에 의사, 치료사 또는 자격 있는 강사와 안전한 방법을 상의해 주세요. 모든 활동에는 위험이 따를 수 있으므로 자신의 속도에 맞게 참여하고, 참여하는 프로그램의 안전 안내를 따라 주세요.<\/p>\n\n<h2>4. 외부 기관, 행사 및 제품<\/h2>\n<ul>\n<li>Xess에 소개된 클럽, 행사, 상점은 Xess가 아닌 다른 기관이 운영합니다.<\/li>\n<li>일정, 가격, 세부 사항은 바뀔 수 있으니 방문 전에 주최 측에 확인해 주세요.<\/li>\n<li>제품 링크는 추천일 뿐 보증이 아니며, 구매는 이용자와 판매자 사이의 거래입니다.<\/li>\n<\/ul>\n\n<h2>5. 금지 행위<\/h2>\n<p>Xess를 악용하지 말아 주세요. 예를 들어 다음 행위를 하면 안 됩니다.<\/p>\n<ul>\n<li>서비스에 무단 침입하거나 과부하를 주거나 방해하는 행위<\/li>\n<li>다른 사람을 사칭하거나 타인의 계정을 사용하는 행위<\/li>\n<li>허락 없이 Xess의 상당 부분을 상업적으로 복제하는 행위<\/li>\n<\/ul>\n\n<h2>6. 콘텐츠의 권리<\/h2>\n<p>Xess의 글, 디자인, 일러스트는 Xess 또는 사용을 허락한 권리자에게 있습니다. 개인적이고 비상업적인 목적으로는 자유롭게 이용하고 공유할 수 있습니다.<\/p>\n\n<h2>7. 계정 해지<\/h2>\n<p>프로필 페이지에서 언제든지 계정을 삭제할 수 있습니다. 이 약관을 위반한 계정은 이용이 정지될 수 있습니다.<\/p>\n\n<h2>8. 보증의 부인<\/h2>\n<p>Xess는 정보를 정확하고 최신으로 유지하기 위해 노력하지만, 서비스는 “있는 그대로” 제공되며 모든 정보가 완전하거나 정확하거나 항상 이용 가능하다고 보장할 수 없습니다.<\/p>\n\n<h2>9. 책임의 제한<\/h2>\n<p>법이 허용하는 범위에서, Xess는 서비스 이용, 소개된 활동이나 행사 참여, 연결된 상점에서 구매한 제품으로 인해 발생한 손해나 부상에 대해 책임을 지지 않습니다.<\/p>\n\n<h2>10. 약관의 변경<\/h2>\n<p>약관이 변경되면 이 페이지 상단의 날짜를 업데이트합니다. 변경 후에도 Xess를 계속 이용하면 변경된 약관에 동의한 것으로 봅니다.<\/p>\n\n<h2>11. 준거법<\/h2>\n<p>이 약관은 대한민국 법률에 따릅니다.<\/p>\n\n<h2>문의하기<\/h2>\n<p>약관에 대해 궁금한 점이 있다면 연락해 주세요.<br><strong>이메일:<\/strong> <span class=\"copy\">bubble.youthimpact@gmail.com<\/span><\/p>\n"}}</script>
<script>
const DOC=JSON.parse(document.getElementById('d').textContent);
const GLOBE='<svg width="16" height="16" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M128,24h0A104,104,0,1,0,232,128,104.12,104.12,0,0,0,128,24Zm88,104a87.61,87.61,0,0,1-3.33,24H174.16a157.44,157.44,0,0,0,0-48h38.51A87.61,87.61,0,0,1,216,128ZM102,168H154a115.11,115.11,0,0,1-26,45A115.27,115.27,0,0,1,102,168Zm-3.9-16a140.84,140.84,0,0,1,0-48h59.88a140.84,140.84,0,0,1,0,48ZM40,128a87.61,87.61,0,0,1,3.33-24H81.84a157.44,157.44,0,0,0,0,48H43.33A87.61,87.61,0,0,1,40,128ZM154,88H102a115.11,115.11,0,0,1,26-45A115.27,115.27,0,0,1,154,88Zm52.33,0H170.71a135.28,135.28,0,0,0-22.3-45.6A88.29,88.29,0,0,1,206.37,88ZM107.59,42.4A135.28,135.28,0,0,0,85.29,88H49.63A88.29,88.29,0,0,1,107.59,42.4ZM49.63,168H85.29a135.28,135.28,0,0,0,22.3,45.6A88.29,88.29,0,0,1,49.63,168Zm98.78,45.6a135.28,135.28,0,0,0,22.3-45.6h35.66A88.29,88.29,0,0,1,148.41,213.6Z"/></svg>';
function pick(){
  const q=new URLSearchParams(location.search).get('lang'), h=location.hash.slice(1);
  if(q==='ko'||h==='ko') return 'ko'; if(q==='en'||h==='en') return 'en';
  try{ const s=localStorage.getItem('xess_legal_lang'); if(s) return s; }catch(e){}
  return (navigator.language||'').toLowerCase().startsWith('ko') ? 'ko' : 'en';
}
let lang=pick();
function show(){
  const d=DOC[lang];
  document.documentElement.lang=lang;
  document.title='Xess · '+d.title;
  document.getElementById('doc').innerHTML=`<h1>${d.title}</h1><p class="meta">${d.meta}</p>${d.body}`;
  const b=document.getElementById('lang');
  b.innerHTML=GLOBE+(lang==='ko'?'EN':'KO');
  b.setAttribute('aria-label',lang==='ko'?'Read in English':'한국어로 보기');
}
document.getElementById('lang').addEventListener('click',()=>{
  lang=lang==='ko'?'en':'ko';
  try{ localStorage.setItem('xess_legal_lang',lang); }catch(e){}
  history.replaceState(null,'','#'+lang); show();
});
window.addEventListener('hashchange',()=>{ const h=location.hash.slice(1); if(h==='ko'||h==='en'){ lang=h; show(); } });
show();
</script>
