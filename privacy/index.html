<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Xess Privacy Policy</title>
<meta name="description" content="Xess Privacy Policy">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* Layout: one readable column; small brand bar, the document in a white card */
:root{
  --bg:#f6f6f6; --card:#ffffff; --fg:#1b1b1b; --muted:#5f5a59; --line:#e4e1e0; --accent:#FF4136;
  --font:'Poppins','Noto Sans KR',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#121010;--card:#1d1a1a;--fg:#f2eeed;--muted:#aaa3a1;--line:#353030;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121010;--card:#1d1a1a;--fg:#f2eeed;--muted:#aaa3a1;--line:#353030;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
body{margin:0;font-family:var(--font);font-size:15.5px;line-height:1.65;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
html[lang="ko"] body{word-break:keep-all}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.bar{display:flex;justify-content:space-between;align-items:center;padding:4px 4px 6px}
.logo{font-size:26px;font-weight:800;letter-spacing:-.02em}.logo b{color:var(--accent)}
.lang{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--card);color:var(--fg);
  border-radius:999px;padding:5px 13px;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer}
.lang:hover{border-color:var(--accent)}
.lang:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
article{background:var(--card);border-radius:28px;padding:30px 26px 34px;display:flex;flex-direction:column;gap:12px}
h1{margin:0;font-size:clamp(28px,6vw,36px);font-weight:800;line-height:1.2;text-wrap:balance}
.meta{margin:0;font-size:13.5px;color:var(--muted)}
h2{margin:16px 0 0;font-size:18px;font-weight:700;line-height:1.35}
p{margin:0}
ul{margin:0;padding-left:1.25em;display:flex;flex-direction:column;gap:6px}
strong{font-weight:600}
.copy{user-select:all;font-weight:500}
footer{text-align:center;font-size:13px;color:var(--muted);padding-top:6px}
</style>

</head>
<body>
<div class="wrap">
  <div class="bar">
    <span class="logo">Xess<b>.</b></span>
    <button class="lang" id="lang" type="button"></button>
  </div>
  <article id="doc" aria-live="polite"></article>
  <footer>© 2026 Xess</footer>
</div>

<script type="application/json" id="d">{"en": {"title": "Privacy Policy", "meta": "Effective Date: February 28, 2026 · Last updated: October 27, 2026", "body": "\n<p>At Xess, we believe in “Turning Barriers into Beginnings.” We also believe that your privacy shouldn't be a barrier. Our approach to data is simple: we only collect what is strictly necessary to make your experience feel personal and welcoming.<\/p>\n<p>You can browse every activity, event and guide on Xess without an account. This policy only applies if you choose to create one.<\/p>\n\n<h2>1. The Only Information We Collect<\/h2>\n<p>We keep our data collection to an absolute minimum:<\/p>\n<ul>\n<li><strong>Name:<\/strong> So the app can greet you and show your profile.<\/li>\n<li><strong>Email address:<\/strong> So you can sign in, and so we can send a password reset or email-change confirmation when you ask for one.<\/li>\n<li><strong>Password:<\/strong> Handled by our sign-in provider, Google Firebase Authentication. It is stored in encrypted form, and we never see it.<\/li>\n<li><strong>Profile picture (optional):<\/strong> We request access to your camera or photo library only if you choose to upload a profile picture. It is used solely to personalize your account view.<\/li>\n<li><strong>Favorites:<\/strong> The list of activities you save with the heart button, so you can find them again.<\/li>\n<\/ul>\n<p>If you sign in with Google, Google shares your name, email address and profile picture with us. We use them only as described above.<\/p>\n<p>Your language choice is saved on your own device, not on our servers.<\/p>\n\n<h2>2. What We Don't Collect<\/h2>\n<p>To keep your experience secure and private:<\/p>\n<ul>\n<li>We do not collect health or medical records, and we never ask about your disability.<\/li>\n<li>We do not track your precise GPS location.<\/li>\n<li>We do not use advertising trackers.<\/li>\n<li>We do not sell your data to third parties.<\/li>\n<\/ul>\n\n<h2>3. How We Use Your Information<\/h2>\n<p>Your information is used exclusively for:<\/p>\n<ul>\n<li><strong>Personalization:<\/strong> Making the Xess interface feel like your own space.<\/li>\n<li><strong>Your account:<\/strong> Signing you in, keeping your account secure, and sending the account emails you request.<\/li>\n<li><strong>Favorites:<\/strong> Saving the activities you choose.<\/li>\n<\/ul>\n\n<h2>4. Storage and Security<\/h2>\n<p>Your profile information is stored securely with Google Firebase (Authentication and Cloud Firestore), which processes it on our behalf. Data is encrypted in transit and may be stored on Google's servers outside your country. Since we do not collect sensitive financial or medical data, the risk to your personal privacy is significantly reduced.<\/p>\n<p>You can update or remove your name and photo at any time on the Profile page.<\/p>\n\n<h2>5. Your Control<\/h2>\n<p>You have full control over your data. If you decide to leave Xess, go to <strong>Profile → Delete account<\/strong>. Your account, name, email address, photo and favorites will be removed from our systems immediately.<\/p>\n\n<h2>6. Children<\/h2>\n<p>If you are under 14, please ask a parent or guardian before creating an account.<\/p>\n\n<h2>7. Links to Other Websites<\/h2>\n<p>Xess links to clubs, event pages and online stores run by others. Those websites have their own privacy policies, and we are not responsible for how they handle your information.<\/p>\n\n<h2>8. Changes to This Policy<\/h2>\n<p>If we change this policy, we will update the date at the top of this page.<\/p>\n\n<h2>Contact Us<\/h2>\n<p>If you have any questions about our “minimal data” philosophy, reach out at:<br><strong>Email:<\/strong> <span class=\"copy\">bubble.youthimpact@gmail.com<\/span><\/p>\n"}, "ko": {"title": "개인정보처리방침", "meta": "시행일: 2026년 2월 28일 · 최종 수정일: 2026년 10월 27일", "body": "\n<p>Xess는 “장벽을 새로운 시작으로”라는 믿음을 가지고 있습니다. 개인정보 역시 장벽이 되어서는 안 된다고 생각합니다. 저희의 원칙은 간단합니다. 여러분의 경험을 더 개인적이고 따뜻하게 만드는 데 꼭 필요한 정보만 수집합니다.<\/p>\n<p>Xess의 모든 활동, 행사, 가이드는 계정 없이 둘러볼 수 있습니다. 이 방침은 계정을 만드는 경우에만 적용됩니다.<\/p>\n\n<h2>1. 수집하는 정보<\/h2>\n<p>수집하는 정보는 최소한으로 제한합니다.<\/p>\n<ul>\n<li><strong>이름:<\/strong> 앱에서 인사를 건네고 프로필을 보여 드리기 위해 사용합니다.<\/li>\n<li><strong>이메일 주소:<\/strong> 로그인에 사용하며, 요청하신 경우 비밀번호 재설정 또는 이메일 변경 확인 메일을 보내 드립니다.<\/li>\n<li><strong>비밀번호:<\/strong> 로그인 서비스인 Google Firebase 인증이 처리하며 암호화되어 저장됩니다. Xess는 비밀번호를 볼 수 없습니다.<\/li>\n<li><strong>프로필 사진(선택):<\/strong> 프로필 사진을 올리기로 선택한 경우에만 카메라 또는 사진 보관함 접근을 요청합니다. 계정 화면을 꾸미는 용도로만 사용합니다.<\/li>\n<li><strong>즐겨찾기:<\/strong> 하트 버튼으로 저장한 활동 목록으로, 다시 찾아볼 수 있도록 저장합니다.<\/li>\n<\/ul>\n<p>Google로 로그인하면 Google이 이름, 이메일 주소, 프로필 사진을 Xess에 제공합니다. 이 정보는 위에 설명한 용도로만 사용합니다.<\/p>\n<p>언어 설정은 저희 서버가 아닌 사용자의 기기에 저장됩니다.<\/p>\n\n<h2>2. 수집하지 않는 정보<\/h2>\n<p>안전하고 사적인 이용을 위해:<\/p>\n<ul>\n<li>건강 또는 의료 기록을 수집하지 않으며, 장애에 관해 묻지 않습니다.<\/li>\n<li>정확한 GPS 위치를 추적하지 않습니다.<\/li>\n<li>광고 추적 도구를 사용하지 않습니다.<\/li>\n<li>개인정보를 제3자에게 판매하지 않습니다.<\/li>\n<\/ul>\n\n<h2>3. 정보의 이용 목적<\/h2>\n<p>수집한 정보는 다음 목적으로만 사용합니다.<\/p>\n<ul>\n<li><strong>개인화:<\/strong> Xess를 나만의 공간처럼 느낄 수 있도록 합니다.<\/li>\n<li><strong>계정 관리:<\/strong> 로그인, 계정 보안, 요청하신 계정 관련 이메일 발송에 사용합니다.<\/li>\n<li><strong>즐겨찾기:<\/strong> 선택한 활동을 저장합니다.<\/li>\n<\/ul>\n\n<h2>4. 보관 및 보안<\/h2>\n<p>프로필 정보는 Xess를 대신해 정보를 처리하는 Google Firebase(인증 및 Cloud Firestore)에 안전하게 보관됩니다. 전송 중인 데이터는 암호화되며, 국외에 있는 Google 서버에 저장될 수 있습니다. 민감한 금융 정보나 의료 정보를 수집하지 않기 때문에 개인정보 위험이 크게 줄어듭니다.<\/p>\n<p>이름과 사진은 프로필 페이지에서 언제든지 수정하거나 삭제할 수 있습니다.<\/p>\n\n<h2>5. 이용자의 권리<\/h2>\n<p>여러분은 자신의 정보를 완전히 관리할 수 있습니다. Xess를 떠나기로 하셨다면 <strong>프로필 → 계정 삭제<\/strong>를 누르세요. 계정, 이름, 이메일 주소, 사진, 즐겨찾기가 즉시 삭제됩니다.<\/p>\n\n<h2>6. 아동<\/h2>\n<p>만 14세 미만이라면 계정을 만들기 전에 부모님이나 보호자에게 먼저 물어봐 주세요.<\/p>\n\n<h2>7. 외부 웹사이트 링크<\/h2>\n<p>Xess는 다른 기관이 운영하는 클럽, 행사 페이지, 온라인 상점으로 연결됩니다. 해당 웹사이트에는 각자의 개인정보처리방침이 적용되며, Xess는 그곳에서의 정보 처리에 책임을 지지 않습니다.<\/p>\n\n<h2>8. 방침의 변경<\/h2>\n<p>이 방침이 변경되면 이 페이지 상단의 날짜를 업데이트합니다.<\/p>\n\n<h2>문의하기<\/h2>\n<p>“최소한의 데이터” 원칙에 대해 궁금한 점이 있다면 연락해 주세요.<br><strong>이메일:<\/strong> <span class=\"copy\">bubble.youthimpact@gmail.com<\/span><\/p>\n"}}</script>
<script>
const DOC=JSON.parse(document.getElementById('d').textContent);
const GLOBE='<svg width="16" height="16" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M128,24h0A104,104,0,1,0,232,128,104.12,104.12,0,0,0,128,24Zm88,104a87.61,87.61,0,0,1-3.33,24H174.16a157.44,157.44,0,0,0,0-48h38.51A87.61,87.61,0,0,1,216,128ZM102,168H154a115.11,115.11,0,0,1-26,45A115.27,115.27,0,0,1,102,168Zm-3.9-16a140.84,140.84,0,0,1,0-48h59.88a140.84,140.84,0,0,1,0,48ZM40,128a87.61,87.61,0,0,1,3.33-24H81.84a157.44,157.44,0,0,0,0,48H43.33A87.61,87.61,0,0,1,40,128ZM154,88H102a115.11,115.11,0,0,1,26-45A115.27,115.27,0,0,1,154,88Zm52.33,0H170.71a135.28,135.28,0,0,0-22.3-45.6A88.29,88.29,0,0,1,206.37,88ZM107.59,42.4A135.28,135.28,0,0,0,85.29,88H49.63A88.29,88.29,0,0,1,107.59,42.4ZM49.63,168H85.29a135.28,135.28,0,0,0,22.3,45.6A88.29,88.29,0,0,1,49.63,168Zm98.78,45.6a135.28,135.28,0,0,0,22.3-45.6h35.66A88.29,88.29,0,0,1,148.41,213.6Z"/></svg>';
function pick(){
  const q=new URLSearchParams(location.search).get('lang'), h=location.hash.slice(1);
  if(q==='ko'||h==='ko') return 'ko'; if(q==='en'||h==='en') return 'en';
  try{ const s=localStorage.getItem('xess_legal_lang'); if(s) return s; }catch(e){}
  return (navigator.language||'').toLowerCase().startsWith('ko') ? 'ko' : 'en';
}
let lang=pick();
function show(){
  const d=DOC[lang];
  document.documentElement.lang=lang;
  document.title='Xess · '+d.title;
  document.getElementById('doc').innerHTML=`<h1>${d.title}</h1><p class="meta">${d.meta}</p>${d.body}`;
  const b=document.getElementById('lang');
  b.innerHTML=GLOBE+(lang==='ko'?'EN':'KO');
  b.setAttribute('aria-label',lang==='ko'?'Read in English':'한국어로 보기');
}
document.getElementById('lang').addEventListener('click',()=>{
  lang=lang==='ko'?'en':'ko';
  try{ localStorage.setItem('xess_legal_lang',lang); }catch(e){}
  history.replaceState(null,'','#'+lang); show();
});
window.addEventListener('hashchange',()=>{ const h=location.hash.slice(1); if(h==='ko'||h==='en'){ lang=h; show(); } });
show();
</script>
</body>
</html>
